name: Build & Test CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python Dependencies
        run: pip install cryptography

      - name: Build Project
        run: |
          mkdir -p build
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

      - name: Prepare Runtime Dirs
        run: |
          sudo mkdir -p /etc/sstd /var/log/sstd
          sudo chown "$USER":"$USER" /etc/sstd /var/log/sstd
          sudo cp config/sstd.ini /etc/sstd/sstd.ini

      - name: Run Server and Test
        env:
          SSTD_HOST: ${{ secrets.HOST || '127.0.0.1' }}
          SSTD_PORT: ${{ secrets.PORT || '41924' }}
          SSTD_KEY_PATH: /etc/sstd/sstd.key
        run: |
          cd build
          ./sstd &
          SERVER_PID=$!
          cd ..
          trap 'kill -SIGTERM $SERVER_PID' EXIT
          sleep 2
          python test/test_multi_client.py

  build-aarch64:
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install cross compiler
        run: sudo apt-get update && sudo apt-get install -y g++-aarch64-linux-gnu

      - name: Build aarch64 binary
        run: |
          cmake -S . -B build-aarch64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc \
            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
          cmake --build build-aarch64 --parallel

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sstd-aarch64-${{ github.sha }}
          path: build-aarch64/sstd
          if-no-files-found: error
          retention-days: 7

  build-amd64:
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build amd64 binary
        run: |
          cmake -S . -B build-amd64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_SYSTEM_NAME=Linux \
            -DCMAKE_SYSTEM_PROCESSOR=x86_64
          cmake --build build-amd64 --parallel

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v4
        with:
          name: sstd-amd64-${{ github.sha }}
          path: build-amd64/sstd
          if-no-files-found: error
          retention-days: 7
