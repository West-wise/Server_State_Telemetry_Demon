  # GitHub Security 탭 및 Actions 탭에 표시될 워크플로우 이름
  name: "CodeQL Security Analysis"

  # -----------------------------------------------------------------
  # 1. 트리거 조건 설정 (on)
  # -----------------------------------------------------------------
  on:
    push:
      branches: [ "main", "dev" ] # 분석을 실행할 대상 브랜치 목록
      paths-ignore:                  # 코드 변경이 있어도 워크플로우를 실행하지 않을 경로
        - '**/*.md'
        - 'docs/**'
        - 'config/**'
        - 'deploy/**'
    pull_request:
      branches: [ "main", "dev" ]            # PR이 해당 브랜치를 타겟으로 생성/업데이트될 때 실행
      types: [ opened, synchronize, reopened ] # PR생성시, Merge시, 닫힌 PR다시 open시
    schedule:
      - cron: '0 3 * * 1'           # 정기 스캔 (매주 월요일 03:00 UTC 기준)
    workflow_dispatch:              # GitHub UI에서 수동으로 워크플로우를 실행할 수 있는 버튼 생성
      inputs:
        debug_enabled:
          description: '디버그 로그 활성화 여부'
          required: false
          default: 'false'

  # -----------------------------------------------------------------
  # 2. 작업 권한 설정 (permissions)
  # CodeQL 스캔 결과를 GitHub Security 탭에 업로드하려면 필수 설정 필요
  # -----------------------------------------------------------------
  permissions:
    actions: read                   # 액션 실행 상태 읽기 권한
    contents: read                  # 리포지토리 소스 코드 읽기 권한
    security-events: write          # Code Scanning 결과(SARIF 파일) 작성 및 업로드 권한

  # -----------------------------------------------------------------
  # 3. 작업 정의 (jobs)
  # -----------------------------------------------------------------
  jobs:
    analyze:
      name: CodeQL 분석 (${{ matrix.language }})
      runs-on: ubuntu-latest        # 실행 환경
      timeout-minutes: 30          # 작업 최대 제한 시간 (기본값: 360분 / 30분)

      permissions:
        actions: read
        contents: read
        security-events: write

      # 매트릭스 전략: 여러 언어를 병렬로 동시 분석
      strategy:
        fail-fast: false            # 하나의 언어 분석이 실패해도 다른 언어의 분석을 중단하지 않고 계속 진행
        matrix:
          # 분석 대상 언어 지정
          # 지원 언어: c-cpp, csharp, go, java-kotlin, javascript-typescript, python, ruby, swift
          language: [ 'c-cpp', 'python' ]

      steps:
      # [Step 1] 소스 코드 체크아웃
      - name: 소스코드 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1            # 커밋 이력을 최신 커밋만 가져옴(0은 전체)

      # [Step 2] CodeQL CLI 및 DB 초기화 (init)
      - name: CodeQL CLI 및 DB초기화
        uses: github/codeql-action/init@v4
        with:
          # [필수] 분석할 언어 지정
          languages: ${{ matrix.language }}

          # [선택] 실행할 기본 쿼리 스위트 선택
          # - default: 기본 보안 쿼리
          # - security-extended: 확장 보안 쿼리 (더 많은 CWE 및 취약점 검출)
          # - security-and-quality: 보안 취약점 + 코드 품질/스타일 쿼리
          queries: security-and-quality
          debug: ${{ inputs.debug_enabled == 'true' }}

      # [Step 3] 컴파일 언어 빌드 (C/C++, C#, Java, Go, Swift 등)
      # 자동 빌드(Autobuild)를 시도하는 스텝
      - name: Autobuild
        id: autobuild
        if: matrix.language == 'c-cpp'
        continue-on-error: true
        uses: github/codeql-action/autobuild@v4
        with:
          # [선택] Autobuild 명령어가 실행될 작업 디렉토리
          working-directory: ./

      #만약 Autobuild가 실패하는 경우, 위 Autobuild 스텝을 주석 처리하고 아래처럼 수동 빌드 명령을 작성합니다.
      - name: CMake 빌드(Autobuild실패시)
        if: matrix.language == 'c-cpp' && steps.autobuild.outcome == 'failure'
        run: |
          cmake -S . -B build-codeql
          cmake --build build-codeql --clean-first --parallel 2

      # [Step 4] CodeQL 정적 분석 실행 및 결과 생성 (analyze)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          # [선택] GitHub Security 탭에서 언어별 결과 구분을 위한 카테고리 식별자
          category: "/language:${{ matrix.language }}"

          # [선택] 분석 결과를 GitHub Code Scanning(Security 탭)에 자동으로 업로드할지 여부 (기본값: true)
          upload: true

          # [선택] SARIF 업로드 처리 완료까지 액션이 대기할지 여부 (기본값: true)
          wait-for-processing: true
